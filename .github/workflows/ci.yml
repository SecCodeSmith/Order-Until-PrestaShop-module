name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: php -l · phpcs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: phpcs
          coverage: none

      - name: PHP syntax lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l

      - name: PHP CodeSniffer (PSR-12 — advisory)
        run: phpcs --standard=phpcs.xml.dist
        continue-on-error: true

  js:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ESLint
        run: npm install --no-audit --no-fund

      - name: ESLint (advisory)
        run: npm run lint:js
        continue-on-error: true

  python-tests:
    name: Python version helper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run Python unit tests
        run: pytest -q

  tag-and-release:
    name: Bump module version, tag & publish zip
    needs: [php, js, python-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Source of truth = the module's own declared version ($this->version in
      # scmorderuntil.php). Read it, bump the patch, and write it back into the
      # module (scmorderuntil.php + config.xml). No git-tag guessing.
      - name: Bump module version
        id: version
        run: python scripts/bump_version.py --write

      - name: Guard against an existing tag
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Bump \$this->version in scmorderuntil.php to release a new version."
            exit 1
          fi

      - name: Commit the version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scmorderuntil.php config.xml
          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            git commit -m "chore(release): bump module to ${{ steps.version.outputs.version }} [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Create and push Git tag
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          git tag -a "$TAG" -m "PrestaShop module $TAG"
          git push origin "$TAG"

      - name: Package module into scmorderuntil.zip
        run: |
          mkdir -p build/scmorderuntil
          rsync -av --exclude='build' --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='tests' --exclude='scripts' --exclude='AI report' --exclude='AI_report' ./ build/scmorderuntil/
          cd build && zip -r ../scmorderuntil.zip scmorderuntil/ && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: PrestaShop Module ${{ steps.version.outputs.tag_name }}
          files: scmorderuntil.zip
          draft: false
          prerelease: false
